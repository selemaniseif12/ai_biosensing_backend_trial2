# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = %(here)s/alembic

# Use os.pathsep for splitting paths
path_separator = os

# Prepend current working directory to sys.path
prepend_sys_path = .

# Database URL (IMPORTANT)
# If using SQLite:
sqlalchemy.url = sqlite:///./app.db

# If using PostgreSQL, comment the SQLite line above and use:
# sqlalchemy.url = postgresql://postgres:password@localhost:5432/ai_biosensing


[post_write_hooks]
# (no hooks enabled)


# Logging configuration
[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
